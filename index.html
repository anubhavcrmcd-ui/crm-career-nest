<html lang="en">

<meta charset="utf-8">

<title>CAREER NEST CRM — V24 Online Registration</title>
<style>
:root{--nav:#0b2447;--nav2:#123b6d;--green:#4b8f2c;--ink:#172033;--muted:#667085;--bg:#f4f7fb;--card:#fff;--line:#e5e7eb;--danger:#c62828;--shadow:0 8px 28px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071d39,#0d4b5d)}
.login-card{width:min(440px,92vw);background:#fff;border-radius:22px;padding:30px;box-shadow:0 25px 80px #0005}
.brand{text-align:center}.brand img{width:210px;max-height:110px;object-fit:contain}.brand h1{margin:8px 0 2px;font-size:22px;color:var(--nav)}
.brand p{margin:0 0 22px;color:var(--muted);font-size:13px}
.app{display:none;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:linear-gradient(180deg,var(--nav),#071a32);color:#fff;padding:18px 12px;overflow:auto;z-index:10}
.side-brand{padding:6px 8px 18px;border-bottom:1px solid #ffffff20;margin-bottom:12px;text-align:center}
.side-brand img{width:150px;background:#fff;border-radius:10px;padding:5px}.side-brand b{display:block;margin-top:8px;font-size:14px}
.nav button{width:100%;border:0;background:transparent;color:#dbeafe;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;font-weight:600}
.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.main{margin-left:250px;padding:20px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.topbar h2{margin:0;font-size:24px}
.user-chip{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:13px}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:27px;margin-top:8px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.section-title h3{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--nav);color:#fff;font-weight:700}
.btn.green{background:var(--green)}.btn.gold{background:#9b7212}.btn.red{background:var(--danger)}.btn.light{background:#eef2f7;color:var(--ink)}.btn.small{padding:6px 9px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{background:#f8fafc;color:#475467}.table-wrap{overflow:auto}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2ff}
.badge.active{background:#e8f7ed;color:#1b6e37}.badge.pending{background:#fff7df;color:#8a6510}.badge.rejected,.badge.archived{background:#fdecec;color:#9f2525}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:800;color:#344054}input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px 11px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#4676a9;box-shadow:0 0 0 3px #4676a920}textarea{min-height:82px;resize:vertical}
.hint,.settings-note{font-size:11px;color:var(--muted);line-height:1.6}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:50;padding:18px}
.modal.show{display:grid}.modal-box{width:min(1000px,96vw);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.close{border:0;background:#f1f3f5;border-radius:50%;width:34px;height:34px;font-size:20px}
.tree ul{list-style:none;padding-left:22px;border-left:1px dashed #b9c2cf;margin-left:8px}.tree li{margin:10px 0}
.node{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:10px;box-shadow:var(--shadow)}
.node b{font-size:13px}.node small{color:var(--muted)}.progress{height:10px;background:#edf1f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}
.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:100}
.toast.show{display:block}/* ===== CAREER NEST ID CARD — CR80 / ID-1 VERTICAL ===== */
.id-card{
  width:53.98mm;
  height:85.60mm;
  min-width:53.98mm;
  min-height:85.60mm;
  box-sizing:border-box;
  background:#fff;
  color:#172033;
  border:.45mm solid #0b2447;
  border-radius:3.1mm;
  overflow:hidden;
  position:relative;
  flex:0 0 53.98mm;
  box-shadow:0 2px 8px rgba(16,24,40,.12);
}
.id-front,.id-back{
  width:100%;
  height:100%;
  box-sizing:border-box;
  padding:3.2mm 3.5mm;
  position:relative;
  overflow:hidden;
}
.id-front{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.id-front .logo,.id-back .logo{
  width:29mm;
  height:9mm;
  object-fit:contain;
  display:block;
  flex:0 0 auto;
  margin:0 auto .8mm;
}
.id-front .card-title{
  font-size:2.65mm;
  line-height:1;
  font-weight:900;
  letter-spacing:.22mm;
  color:#0b2447;
  margin:0 0 1.1mm;
}
.avatar{
  width:22mm;
  height:25mm;
  object-fit:cover;
  border-radius:1.2mm;
  border:.4mm solid #cbd5e1;
  background:#f8fafc;
  display:block;
  margin:0 auto 1.6mm;
  flex:0 0 auto;
}
.id-photo-placeholder{
  width:22mm;
  height:25mm;
  border:.4mm solid #cbd5e1;
  border-radius:1.2mm;
  background:#f8fafc;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 1.6mm;
  font-size:2mm;
  font-weight:800;
  color:#667085;
  flex:0 0 auto;
}
.id-fields{
  width:100%;
  text-align:left;
  font-size:2.05mm;
  line-height:1.08;
  flex:0 0 auto;
}
.id-fields .field{
  display:grid;
  grid-template-columns:17mm 1fr;
  column-gap:1.2mm;
  align-items:start;
  min-height:4.05mm;
  margin:0;
  padding:.45mm 0;
  border-bottom:.2mm solid #e5e7eb;
}
.id-fields .field:last-child{border-bottom:0}
.id-fields b{
  display:block;
  color:#0b2447;
  font-size:1.75mm;
  line-height:1.1;
  letter-spacing:.08mm;
  margin:0;
}
.id-fields span{
  display:block;
  font-size:2.05mm;
  line-height:1.08;
  font-weight:750;
  word-break:break-word;
  overflow-wrap:anywhere;
}
.id-sign{
  position:absolute;
  left:3.5mm;
  right:3.5mm;
  bottom:2.8mm;
  height:9.2mm;
  box-sizing:border-box;
  border-top:.25mm solid #98a2b3;
  padding-top:.8mm;
  text-align:center;
  background:#fff;
}
.id-sign small{
  display:block;
  font-size:1.65mm;
  line-height:1;
  font-weight:900;
  color:#475467;
  letter-spacing:.1mm;
}
.id-sign img{
  display:block;
  height:5.8mm;
  max-width:22mm;
  object-fit:contain;
  margin:.55mm auto 0;
}
.id-back{
  text-align:left;
}
.id-back .logo{
  margin:0 auto .7mm;
}
.back-heading{
  font-size:2.45mm;
  line-height:1;
  font-weight:900;
  color:#0b2447;
  text-align:center;
  margin:0 0 2.2mm;
  letter-spacing:.18mm;
}
.back-label{
  font-size:1.8mm;
  line-height:1;
  font-weight:900;
  color:#0b2447;
  margin:1.7mm 0 .45mm;
}
.back-value{
  font-size:1.95mm;
  line-height:1.15;
  margin:0;
  word-break:break-word;
  overflow-wrap:anywhere;
}
.back-important{
  font-size:1.85mm;
  line-height:1;
  font-weight:900;
  color:#0b2447;
  margin-top:2.4mm;
}
.back-list{
  font-size:1.75mm;
  line-height:1.27;
  margin:.8mm 0 0;
  padding-left:3.2mm;
}
.back-list li{margin:.45mm 0}
.id-card-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
.id-card-pair{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.id-card-label{font-size:12px;color:#667085;text-align:center;margin:0 0 6px;font-weight:800}
@media print{
  @page{size:53.98mm 85.60mm;margin:0}
  html,body{width:53.98mm!important;margin:0!important;padding:0!important;background:#fff!important}
  body *{visibility:hidden!important}
  .print-area,.print-area *{visibility:visible!important}
  .print-area{
    position:absolute!important;
    left:0!important;
    top:0!important;
    width:53.98mm!important;
    margin:0!important;
    padding:0!important;
  }
  .id-card-pair{
    display:block!important;
    width:53.98mm!important;
    margin:0!important;
    padding:0!important;
  }
  .id-card-pair > div{display:block!important;width:53.98mm!important;margin:0!important;padding:0!important}
  .id-card-label{display:none!important}
  .id-card{
    display:block!important;
    width:53.98mm!important;
    height:85.60mm!important;
    min-width:53.98mm!important;
    min-height:85.60mm!important;
    margin:0!important;
    border-radius:3.1mm!important;
    box-shadow:none!important;
    page-break-after:always!important;
    break-after:page!important;
  }
  .id-card:last-child{page-break-after:auto!important;break-after:auto!important}
}
@media(max-width:900px){.sidebar{width:215px}.main{margin-left:215px}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.sidebar{position:relative;width:100%;height:auto}.main{margin-left:0}.form-grid,.two,.three,.kpis{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
@media print{body *{visibility:hidden!important}.print-area,.print-area *{visibility:visible!important}.print-area{position:absolute;left:0;top:0;width:100%}}

<script>
(function(){
  // Production form rules:
  // All normal text fields are automatically uppercased.
  // Email and password remain case-sensitive/free-form.
  function isExcluded(el){
    return !el || ['EMAIL','PASSWORD'].includes((el.type || '').toUpperCase()) ||
      ['email','password'].includes((el.id || '').toLowerCase());
  }

  function upperize(el){
    if (!el || isExcluded(el)) return;
    if (typeof el.value === 'string') el.value = el.value.toUpperCase();
  }

  document.addEventListener('input', function(e){
    const el = e.target;
    if (!el || !['INPUT','TEXTAREA','SELECT'].includes(el.tagName)) return;
    if (isExcluded(el)) return;

    // PAN: 5 letters + 4 digits + 1 letter.
    const id = (el.id || '').toLowerCase();
    const name = (el.name || '').toLowerCase();
    if (id.includes('pan') || name.includes('pan')) {
      el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
    } else if (id.includes('ifsc') || name.includes('ifsc')) {
      // IFSC is 11 alphanumeric characters; standard format is 4 letters + 0 + 6 alphanumeric.
      el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,11);
    } else {
      upperize(el);
    }
  }, true);

  document.addEventListener('blur', function(e){
    upperize(e.target);
  }, true);

  window.validateCareerNestFields = function(){
    const errors = [];
    document.querySelectorAll('input, textarea, select').forEach(function(el){
      if (isExcluded(el)) return;
      const id = (el.id || '').toLowerCase();
      const name = (el.name || '').toLowerCase();
      const value = (el.value || '').trim().toUpperCase();

      if ((id.includes('pan') || name.includes('pan')) && value) {
        if (!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(value)) {
          errors.push('PAN must be 10 characters: 5 letters + 4 numbers + 1 letter.');
        }
      }
      if ((id.includes('ifsc') || name.includes('ifsc')) && value) {
        if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(value)) {

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function uid(p='CN'){return p+'-'+new Date().getFullYear()+'-'+String(Math.floor(100000+Math.random()*900000))}
function normalizeRoleCode(r){
  const x=String(r||'').trim().toUpperCase();
  return ({'SUPER_ADMIN':'SUPER ADMIN','INDEPENDENT_PROJECT_MANAGER':'INDEPENDENT PROJECT MANAGER','STATE_CHANNEL_GROWTH_MASTER':'STATE CHANNEL GROWTH MASTER','DISTRICT_CHANNEL_ASSOCIATE':'DISTRICT CHANNEL ASSOCIATE','INDEPENDENT_CAREER_CONSULTANT':'INDEPENDENT CAREER CONSULTANT'}[x]||x);
}

function scopeMembers(ms){
 if(isAdmin())return ms;
 const ids=new Set([state.user.id]);let loop=true;
 while(loop){loop=false;for(const m of ms)if(m.parentId&&ids.has(m.parentId)&&!ids.has(m.id)){ids.add(m.id);loop=true}}
 return ms.filter(m=>ids.has(m.id));
}

function memberMemberId(id,ms){const m=ms.find(x=>Number(x.id)===Number(id));return m?m.memberId:'—'}

function memberScopeIds(ms){return new Set(scopeMembers(ms).map(m=>m.id))}
function scopedSales(ms,sales){const ids=memberScopeIds(ms);return sales.filter(s=>ids.has(Number(s.sellerId)))}
function scopedTargets(ms,targets){const ids=memberScopeIds(ms);return targets.filter(t=>ids.has(Number(t.memberId)))}
function scopedPayouts(ms,payouts){const ids=memberScopeIds(ms);return payouts.filter(p=>ids.has(Number(p.memberId)))}
function scopedAudits(ms,audits){
 if(isAdmin()) return audits;
 const ids=new Set(scopeMembers(ms).map(m=>m.memberId));
 return audits.filter(a=>ids.has(a.user)||a.user===state.user?.memberId);

function inDateRange(date,from,to){const d=String(date||'').slice(0,10);return (!from||d>=from)&&(!to||d<=to)}
function dashboardRangeHTML(from='',to=''){return `<div class="card" style="margin-bottom:14px"><div class="section-title"><h3>SALES & PAYOUT DATE RANGE</h3><button class="btn" onclick="clearDashboardRange()">CLEAR</button></div><div class="form-grid"><div class="field"><label>FROM DATE</label><input id="dashFrom" type="date" value="${from}"></div><div class="field"><label>TO DATE</label><input id="dashTo" type="date" value="${to}"></div><div class="field"><label>VIEW</label><select id="dashView"><option value="SUMMARY">SUMMARY</option><option value="DAY">DAY</option><option value="WEEK">WEEK</option><option value="MONTH">MONTH</option></select></div><div class="field" style="display:flex;align-items:end"><button class="btn green" onclick="applyDashboardRange()">APPLY DATE RANGE</button></div></div></div>`}
function dashboardDateRows(sales,payouts,from,to){
 const ss=sales.filter(s=>inDateRange(s.date,from,to));
 const pp=payouts.filter(p=>p.status==='PAID'&&inDateRange(p.paymentDate,from,to));
 const saleStats={sales:ss.reduce((a,x)=>a+Number(x.total||0),0),gross:ss.reduce((a,x)=>a+Number(x.commission||0),0),tds:ss.reduce((a,x)=>a+Number(x.tds||0),0),net:ss.reduce((a,x)=>a+netPayable(x),0),paid:pp.reduce((a,x)=>a+Number(x.net||0),0)};
 return {ss,pp,...saleStats};
}
function dashboardGroupRows(sales,payouts,from,to,view){
 const ss=sales.filter(s=>inDateRange(s.date,from,to)),pp=payouts.filter(p=>p.status==='PAID'&&inDateRange(p.paymentDate,from,to));
 const groups={};
 const keyFor=(d)=>{const dt=new Date(d+'T00:00:00');if(view==='DAY')return d;if(view==='MONTH')return d.slice(0,7);if(view==='WEEK'){const x=new Date(dt);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x.toISOString().slice(0,10)}return 'SELECTED RANGE'};
 ss.forEach(s=>{const k=keyFor(String(s.date||'').slice(0,10));groups[k]??={sales:0,gross:0,tds:0,net:0,paid:0};groups[k].sales+=Number(s.total||0);groups[k].gross+=Number(s.commission||0);groups[k].tds+=Number(s.tds||0);groups[k].net+=netPayable(s)});
 pp.forEach(p=>{const k=keyFor(String(p.paymentDate||'').slice(0,10));groups[k]??={sales:0,gross:0,tds:0,net:0,paid:0};groups[k].paid+=Number(p.net||0)});
 return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v.sales)}</td><td>${money(v.gross)}</td><td>${money(v.tds)}</td><td>${money(v.net)}</td><td>${money(v.paid)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">NO DATA FOR SELECTED RANGE</td></tr>';
}

function subtreeIds(root,ms){const ids=new Set([root]);let loop=true;while(loop){loop=false;for(const m of ms)if(m.parentId&&ids.has(m.parentId)&&!ids.has(m.id)){ids.add(m.id);loop=true}}return ids}
function rootPM(m,ms){let x=m,guard=0;while(x&&guard++<20){if(x.role==='INDEPENDENT PROJECT MANAGER')return x;x=ms.find(a=>a.id===x.parentId)}return null}
function allocationForPM(pmId,ms,exclude=null){const ids=subtreeIds(pmId,ms);return ms.filter(m=>ids.has(m.id)&&m.id!==pmId&&m.id!==exclude&&m.commissionType==='PERCENTAGE').reduce((a,m)=>a+Number(m.commissionValue||0),0)}

function netPayable(s){return Math.max(0,Number(s.commission||0)-Number(s.tds||0))}
function teamSalesFor(memberId,ms,sales){
 const ids=subtreeIds(memberId,ms); return sales.filter(s=>ids.has(s.sellerId));
}
function payoutRollup(memberId,ms,sales){
 const rows=teamSalesFor(memberId,ms,sales);
 return {sales:rows.reduce((a,s)=>a+Number(s.total||0),0),gross:rows.reduce((a,s)=>a+Number(s.commission||0),0),tds:rows.reduce((a,s)=>a+Number(s.tds||0),0),net:rows.reduce((a,s)=>a+netPayable(s),0),count:rows.length};
}
function directTeamPayouts(member,ms,sales){
 const children=ms.filter(m=>Number(m.parentId)===Number(member.id));
 return children.map(ch=>({member:ch,rollup:payoutRollup(ch.id,ms,sales)}));
}
function payoutStatsCard(title,r){return `<div class="card" style="margin:12px 0"><h3>${esc(title)}</h3><div class="grid four"><div><small>TEAM SALES</small><h3>${money(r.sales)}</h3></div><div><small>GROSS COMMISSION</small><h3>${money(r.gross)}</h3></div><div><small>TDS</small><h3>${money(r.tds)}</h3></div><div><small>TOTAL PAYABLE</small><h3>${money(r.net)}</h3></div></div></div>`}
function paymentExportRows(member,ms,sales){
 const rows=teamSalesFor(member.id,ms,sales);
 return rows.map(function(s){
  const seller=ms.find(function(m){return m.id===s.sellerId});
  return {payTo:member.name,payToMemberId:member.memberId,actualSeller:seller?seller.name:'',actualSellerId:seller?seller.memberId:'',saleId:s.saleId,date:s.date,product:s.productName,total:s.total,grossCommission:s.commission,tds:s.tds,totalPayable:netPayable(s),status:s.payoutId?'PAID':'UNPAID'};
 });
}

async function copyText(v){
  v=String(v||'');
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(v);
      toast('REGISTRATION LINK COPIED');
      return true;
    }
  }catch(_){}
  try{
    const ta=document.createElement('textarea');
    ta.value=v;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.top='0';ta.style.left='0';
    ta.style.width='1px';ta.style.height='1px';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy');ta.remove();
    if(ok){toast('REGISTRATION LINK COPIED');return true;}
  }catch(_){}
  const box=document.createElement('div');
  box.className='card';
  box.style.cssText='position:fixed;inset:20px;z-index:200;max-width:900px;margin:auto;height:max-content;box-shadow:0 20px 60px #0005';
  box.innerHTML='<h3>COPY REGISTRATION LINK</h3><textarea style="min-height:110px"></textarea><div class="actions" style="margin-top:10px"><button type="button" class="btn green" id="manualCopyBtn">COPY NOW</button><button type="button" class="btn light" id="manualCloseBtn">CLOSE</button></div>';
  document.body.appendChild(box);
  const t=box.querySelector('textarea');t.value=v;t.focus();t.select();t.setSelectionRange(0,t.value.length);
  box.querySelector('#manualCopyBtn').onclick=async()=>{
    try{await navigator.clipboard.writeText(v);toast('REGISTRATION LINK COPIED');box.remove();return;}catch(_){}
    try{t.focus();t.select();t.setSelectionRange(0,t.value.length);if(document.execCommand('copy')){toast('REGISTRATION LINK COPIED');box.remove();return;}}catch(_){}
    toast('LINK SELECTED — PRESS CTRL+C');
  };
  box.querySelector('#manualCloseBtn').onclick=()=>box.remove();
  return false;
}

async function savePublicMember(e){

  const password=String(f.get('password')||'').trim();
  const mobile=String(f.get('mobile')||'').replace(/\D/g,'');
  if(!name)return toast('FULL NAME IS REQUIRED');
  if(!email||!email.includes('@'))return toast('VALID EMAIL IS REQUIRED');
  if(!/^[6-9][0-9]{9}$/.test(mobile))return toast('MOBILE MUST BE EXACTLY 10 DIGITS');
  if(password.length<8)return toast('PASSWORD MUST BE AT LEAST 8 CHARACTERS');
  if(!f.get('declaration'))return toast('DECLARATION IS REQUIRED');
  const requiredDocs=['photo','signature','aadhaarDoc','panDoc','cheque'];
  for(const k of requiredDocs){
    const file=f.get(k);
    if(!file||!file.size)return toast(k==='aadhaarDoc'?'AADHAAR DOCUMENT IS REQUIRED':k==='panDoc'?'PAN DOCUMENT IS REQUIRED':k==='cheque'?'CANCELLED CHEQUE / BANK DOCUMENT IS REQUIRED':k==='signature'?'SIGNATURE IS REQUIRED':'PHOTO IS REQUIRED');
    const ok=(k==='photo'||k==='signature')?file.type.startsWith('image/'):(file.type.startsWith('image/')||file.type==='application/pdf');
    if(!ok)return toast('INVALID FILE TYPE FOR '+k.toUpperCase());
    if(file.size>5*1024*1024)return toast(k.toUpperCase()+' MUST BE 5 MB OR LESS');
  }
  const pan=String(f.get('pan')||'').trim().toUpperCase();if(pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan))return toast('PAN MUST BE 10 CHARACTERS: 5 LETTERS + 4 NUMBERS + 1 LETTER');
  const pin=String(f.get('pin')||'').replace(/\D/g,'');if(pin&&!/^[0-9]{6}$/.test(pin))return toast('PIN CODE MUST BE EXACTLY 6 DIGITS');
  const aad=String(f.get('aadhaar4')||'').replace(/\D/g,'');if(aad&&!/^[0-9]{4}$/.test(aad))return toast('AADHAAR LAST 4 MUST BE 4 DIGITS');
  const ifsc=String(f.get('ifsc')||'').trim().toUpperCase();if(ifsc&&!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc))return toast('IFSC MUST BE 11 CHARACTERS: 4 LETTERS + 0 + 6 ALPHANUMERIC');
  const {data:authData,error:authError}=await window.careerNestSupabase.auth.signUp({email,password});
  if(authError){
    const msg=String(authError.message||'').toLowerCase();
    return toast(msg.includes('already')||msg.includes('registered')?'EMAIL ALREADY REGISTERED':authError.message);
  }
  const authUser=authData?.user;
  if(!authUser)return toast('AUTHENTICATION USER WAS NOT CREATED');
  const docs={};
  for(const k of requiredDocs){const file=f.get(k);if(file&&file.size)docs[k]=await readFile(file);}

function decodeRegistrationToken(raw){
  let s=String(raw||'').trim();
  // URLSearchParams can turn a literal '+' in a manually-copied base64 token into a space.
  s=s.replace(/ /g,'+').replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  const bin=atob(s);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder('utf-8',{fatal:false}).decode(bytes));
}

 if(!/^[6-9][0-9]{9}$/.test(mobile))return toast('MOBILE MUST BE EXACTLY 10 DIGITS');
 if(aa.some(x=>x.id!==id&&String(x.email||'').trim().toLowerCase()===email))return toast('EMAIL ALREADY EXISTS');
 if(aa.some(x=>x.id!==id&&String(x.mobile||'').replace(/\D/g,'')===mobile))return toast('MOBILE ALREADY EXISTS');
 const pan=String(f.get('pan')||'').trim().toUpperCase();if(pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan))return toast('PAN MUST BE 10 CHARACTERS: 5 LETTERS + 4 NUMBERS + 1 LETTER');
 const pin=String(f.get('pin')||'').replace(/\D/g,'');if(pin&&!/^[0-9]{6}$/.test(pin))return toast('PIN CODE MUST BE EXACTLY 6 DIGITS');
 const aad=String(f.get('aadhaar4')||'').replace(/\D/g,'');if(aad&&!/^[0-9]{4}$/.test(aad))return toast('AADHAAR LAST 4 MUST BE 4 DIGITS');
 const ifsc=String(f.get('ifsc')||'').trim().toUpperCase();if(ifsc&&!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc))return toast('IFSC MUST BE 11 CHARACTERS: 4 LETTERS + 0 + 6 ALPHANUMERIC');
 const requiredDocs=['photo','signature','aadhaarDoc','panDoc','cheque'];
if(!id){
 for(const k of requiredDocs){
  const file=f.get(k);
  if(!file || !file.size)return toast(k==='aadhaarDoc'?'AADHAAR DOCUMENT IS REQUIRED':k==='panDoc'?'PAN DOCUMENT IS REQUIRED':k==='cheque'?'CANCELLED CHEQUE / BANK DOCUMENT IS REQUIRED':k==='signature'?'SIGNATURE IS REQUIRED':'PHOTO IS REQUIRED');
  const okTypes=(k==='photo'||k==='signature')?file.type.startsWith('image/'):(file.type.startsWith('image/')||file.type==='application/pdf');
  if(!okTypes)return toast('INVALID FILE TYPE FOR '+k.toUpperCase());
  if(file.size>5*1024*1024)return toast(k.toUpperCase()+' MUST BE 5 MB OR LESS');
 }
}
const password=String(f.get('password')||'').trim();if(!id&&password.length<8)return toast('PASSWORD MUST BE AT LEAST 8 CHARACTERS');
 const type=f.get('commissionType'),val=Number(f.get('commissionValue')||0);if(!Number.isFinite(val)||val<0)return toast('INVALID COMMISSION');
 if(parentId&&type==='PERCENTAGE'){const p=aa.find(x=>x.id===parentId),pm=rootPM(p,aa);if(pm){const used=allocationForPM(pm.id,aa,id);if(used+val>Number(pm.commissionValue||0)+1e-9)return toast('TEAM COMMISSION ALLOCATION CANNOT EXCEED PM COMMISSION POOL')}}
 const o=old?{...old}:{memberId:uid('CN'),createdAt:new Date().toISOString()};
 ['name','father','dob','address','state','district','city','accountName','bank','accountNo','role','status','joiningDate','commissionType'].forEach(k=>o[k]=String(f.get(k)||'').trim().toUpperCase());
 o.mobile=mobile;o.email=email;o.pan=pan;o.pin=pin;o.aadhaar4=aad;o.ifsc=ifsc;o.targetAmount=Number(f.get('targetAmount')||0);o.password=(password || old?.password || (isAdmin() ? 'Admin@123' : 'ChangeMe@123'));o.parentId=parentId;o.commissionValue=val;
 for(const k of ['photo','signature','aadhaarDoc','panDoc','cheque']){const file=f.get(k);if(file&&file.size)o[k]=await readFile(file)}
 if(!id) o.status = pub ? 'PENDING' : (isAdmin() ? 'ACTIVE' : 'PENDING');
 await put('members',o);
 await audit(id?'MEMBER_EDITED':'MEMBER_CREATED',o.memberId,o.name);
 if(pub && !id){
   window.__publicRegistration=null;
   const box=document.getElementById('publicRegistration');
   if(box){
     box.innerHTML=`<div class="login-card" style="max-width:720px;width:95%"><div class="brand"><h1>CAREER NEST</h1><p>REGISTRATION SUBMITTED</p></div><div class="card"><h3>REGISTRATION RECEIVED</h3><p>Your registration has been submitted successfully and is pending approval.</p><p><b>MEMBER ID:</b> ${esc(o.memberId)}</p></div><button class="btn" onclick="location.href=location.href.split('?')[0]">GO TO LOGIN</button></div>`;
   }
   return;
 }
 closeModal();
 toast(id?'MEMBER UPDATED':'MEMBER REGISTERED');
 if(state.user && state.user.id){ state.user=await get('members',state.user.id); sessionStorage.setItem('cn_user',JSON.stringify(state.user)); }
 go(state.page);
}
async function readFile(f){if(!f)return null;return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}

function closeModal(){document.getElementById('modal').classList.remove('show')}

async function openSaleForm(){
 const aa=await all('members'),ms=scopeMembers(aa).filter(m=>m.status==='ACTIVE'&&m.role!=='SUPER ADMIN'),ps=await all('products');
 document.getElementById('modalTitle').textContent='Record Sale';document.getElementById('modalBody').innerHTML=`<form id="saleForm" class="form-grid">
 <div class="field"><label>Seller</label><select name="sellerId" required>${ms.map(m=>`<option value="${m.id}" ${m.id===state.user.id?'selected':''}>${esc(m.name)} • ${esc(m.memberId)}</option>`).join('')}</select></div>
 <div class="field"><label>Product</label><select name="productId" required>${ps.filter(p=>p.status==='ACTIVE').map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join('')}</select></div>
 <div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" value="1"></div><div class="field"><label>Sale Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>

async function saveSale(e){
 e.preventDefault();const f=new FormData(e.target),aa=await all('members'),p=await get('products',Number(f.get('productId'))),seller=aa.find(m=>m.id===Number(f.get('sellerId'))),q=Number(f.get('quantity')||1),base=Number(p.base||0)*q,total=Number(p.price||0)*q,commission=seller.commissionType==='FIXED'?Number(seller.commissionValue||0)*q:base*Number(seller.commissionValue||0)/100,s=await settings(),tds=commission*Number(s.tds||5)/100;
 const o={saleId:uid('SALE'),date:f.get('date'),sellerId:seller.id,productId:p.id,productName:p.name,quantity:q,customerName:f.get('customerName'),customerMobile:f.get('customerMobile'),customerEmail:f.get('customerEmail'),customerAddress:f.get('customerAddress'),price:p.price,gst:p.gst,base,total,commission,tds,status:'COMPLETED',totalPayable:Math.max(0,commission-tds)};
 await put('sales',o);await audit('SALE_CREATED',o.saleId,`${seller.name} / ${p.name}`);closeModal();toast('Sale saved. Commission calculated.');go('sales')
}

 document.getElementById('modal').classList.add('show');document.getElementById('targetForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await put('targets',{memberId:Number(f.get('memberId')),month:f.get('month'),amount:Number(f.get('amount')),units:Number(f.get('units')),createdAt:new Date().toISOString()});await audit('TARGET_CREATED');closeModal();go('targets')}

async function openPayoutForm(){
 const aa=await all('members'),ms=scopeMembers(aa),ss=(await all('sales')).filter(s=>ms.some(m=>m.id===s.sellerId)&&!s.payoutId);if(!ss.length)return toast('No unpaid commission available');
 document.getElementById('modalTitle').textContent='Process Payout';document.getElementById('modalBody').innerHTML=`<form id="payoutForm" class="form-grid"><div class="field full"><label>Select Sale / Commission</label><select name="saleId">${ss.map(s=>`<option value="${s.id}">${s.saleId} — ${memberName(s.sellerId,aa)} — Net ${money(s.commission-s.tds)}</option>`).join('')}</select></div>
 <div class="field"><label>Payment Date</label><input name="paymentDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Payment Mode</label><select name="mode"><option>Bank Transfer</option><option>UPI</option><option>Cash</option><option>Cheque</option></select></div>
 <div class="field"><label>UTR / Transaction No.</label><input name="utr"></div><div class="field"><label>Notes</label><input name="notes"></div><div class="field full"><button class="btn green">Mark Paid</button></div></form>`;
 document.getElementById('modal').classList.add('show');document.getElementById('payoutForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),s=await get('sales',Number(f.get('saleId'))),aa2=await all('members'),m=aa2.find(x=>x.id===s.sellerId),p={payoutId:uid('PAY'),memberId:m.id,memberName:m.name,saleId:s.saleId,gross:s.commission,tds:s.tds,net:s.commission-s.tds,paymentDate:f.get('paymentDate'),mode:f.get('mode'),utr:f.get('utr'),notes:f.get('notes'),status:'PAID'};await put('payouts',p);s.payoutId=p.payoutId;await put('sales',s);await audit('PAYOUT_MARKED_PAID',p.payoutId,m.name);closeModal();toast('Payout marked paid');go('payouts')}

function authorisedSignatureForMember(m,aa){
  const pm=rootPM(m,aa);
  return pm?.signature || '';
}

    ? `<img class="avatar" src="${m.photo}" alt="Member Photo">`

async function printRegistration(id){const m=await get('members',id),w=window.open('','_blank');w.document.write(`<html><head><title>KYC Registration</title><style>body{font-family:Arial;padding:25px}h1{color:#0b2447}table{width:100%;border-collapse:collapse}td{padding:7px;border:1px solid #ddd}</style></head><body><img src="${LOGO}" style="width:190px"><h1>CAREER NEST — REGISTRATION / KYC</h1><table>${Object.entries(m).filter(([k])=>!['password','photo','signature','aadhaarDoc','panDoc','cheque'].includes(k)).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join('')}</table><p>Generated offline: ${new Date().toLocaleString()}</p><script>window.print()<\/script></body></html>`);w.document.close()}
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function exportPaymentCenter(){const aa=await all('members'),ss=await all('sales');let rows=[];if(isAdmin()){for(const pm of aa.filter(m=>m.role==='INDEPENDENT PROJECT MANAGER'))rows.push(...paymentExportRows(pm,aa,ss));}else{for(const ch of aa.filter(m=>Number(m.parentId)===Number(state.user.id)))rows.push(...paymentExportRows(ch,aa,ss));}downloadPaymentCSV(`career-nest-payment-center-${Date.now()}.csv`,rows);await audit('EXPORT_PAYMENT_CENTER','',`ROWS ${rows.length}`)}
async function exportCSV(storeName){const ms=await all('members');let rows=[];if(storeName==='members'){rows=scopeMembers(ms).map(m=>({...m,memberName:m.name,memberID:m.memberId,parentName:memberName(m.parentId,ms)}));}else if(storeName==='sales'){rows=scopedSales(ms,await all('sales')).map(x=>{const m=ms.find(mm=>Number(mm.id)===Number(x.sellerId));return {...x,sellerName:m?.name||'',sellerMemberID:m?.memberId||'',sellerRole:m?.role||'',totalPayableCommission:netPayable(x)};});}else if(storeName==='ledger'){rows=scopedSales(ms,await all('sales')).map(x=>{const m=ms.find(mm=>Number(mm.id)===Number(x.sellerId));return {date:x.date,saleId:x.saleId,sellerName:m?.name||'',sellerMemberID:m?.memberId||'',sellerRole:m?.role||'',base:x.base,grossCommission:x.commission,tds:x.tds,totalPayableCommission:netPayable(x),status:x.payoutId?'PAID':'UNPAID'};});}else if(storeName==='targets'){rows=scopedTargets(ms,await all('targets')).map(x=>({...x,memberName:memberName(x.memberId,ms),memberID:memberMemberId(x.memberId,ms)}));}else if(storeName==='payouts'){rows=scopedPayouts(ms,await all('payouts')).map(x=>({...x,memberName:x.memberName||memberName(x.memberId,ms),memberID:x.memberId?memberMemberId(x.memberId,ms):'',totalPayableCommission:Number(x.net||0)}));}else if(storeName==='audit'){rows=scopedAudits(ms,await all('audit'));}else if(storeName==='products'){rows=await all('products');}else{rows=await all(storeName);}if(!rows.length)return toast('No data');const keys=[...new Set(rows.flatMap(o=>Object.keys(o)))],csv=[keys.join(','),...rows.map(o=>keys.map(k=>`"${String(o[k]??'').replaceAll('\"','\"\"')}"`).join(','))].join('\n');download(`career-nest-${storeName}-${Date.now()}.csv`,csv,'text/csv');await audit('EXPORT_CSV',storeName,`ROWS ${rows.length}`)}
async function backupData(){
 const ms=await all('members'),data={version:2,exportedAt:new Date().toISOString(),scope:isAdmin()?'ALL':'OWN_AND_TEAM'};
 data.members=scopeMembers(ms);data.products=await all('products');data.sales=scopedSales(ms,await all('sales'));data.targets=scopedTargets(ms,await all('targets'));data.payouts=scopedPayouts(ms,await all('payouts'));data.audit=scopedAudits(ms,await all('audit'));data.settings=isAdmin()?await all('settings'):[];
 download(`career-nest-backup-${Date.now()}.json`,JSON.stringify(data,null,2),'application/json');await audit('BACKUP_CREATED','',`SCOPE ${data.scope}`)
}
async function restoreData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!confirm('Restore will replace local CRM data. Continue?'))return;for(const s of ['members','products','sales','targets','payouts','audit','settings']){await clear(s);for(const o of (data[s]||[])){const c={...o};delete c.id;await put(s,c)}}toast('Restore completed. Reloading…');setTimeout(()=>location.reload(),800)}catch(e){toast('Invalid backup file')}}
async function factoryReset(){if(!confirm('DELETE ALL LOCAL CRM DATA? Make a backup first.'))return;for(const s of ['members','products','sales','targets','payouts','audit','settings'])await clear(s);location.reload()}
(async()=>{
 try{
  const hasRegistrationLink=new URLSearchParams(location.search).has('register');
  if(hasRegistrationLink){const handled=await openPublicRegistration();if(handled)return;}
  await initDB();
 }catch(e){console.error(e);alert(e?.message||'Unable to initialize Career Nest CRM');}
